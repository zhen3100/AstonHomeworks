spring.application.name=gateway-service
server.port=8080

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# User Service Route
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**
spring.cloud.gateway.routes[0].filters[0]=CircuitBreaker=userService,forward:/fallback/user-service
spring.cloud.gateway.routes[0].filters[1]=RequestRateLimiter=10,20

# Notification Service Route
spring.cloud.gateway.routes[1].id=notification-service
spring.cloud.gateway.routes[1].uri=lb://notification-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/notifications/**
spring.cloud.gateway.routes[1].filters[0]=CircuitBreaker=notificationService,forward:/fallback/notification-service

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/